# ~/.config/kitty-tweet/kitty-tweet.conf   (env vars override this file, flags override both)
MAXW=74
MAXH=12
MAXIMG=4
MAXQLINES=6
SHOW_PARENT=1
SHOW_SOURCE=1    # print source label in lower right (iPhone, Android, Web app)
STRIP_TRACKING=1 # strip common tracking params on urls
BOXES=0          # print ascii box around tweets, quotes, cards (apt install boxes)
MODE=guest       # auth | guest (default)
# rewrite x.com/twitter.com links (profiles, mentions, tweets), e.g. a nitter instance
#DOMAIN=nitter.net
